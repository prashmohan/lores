services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lores-backend-dev
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/lores.db}
      - JWT_SECRET=${JWT_SECRET:-lores-dev-secret-key-change-in-prod-32bytes}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:3000,http://localhost:${APP_PORT:-8156}}
    volumes:
      - lores_dev_data:/app/data
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/requirements-dev.txt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lores-frontend-dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8156}:5173"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json

volumes:
  lores_dev_data:
