services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lores-backend
    restart: unless-stopped
    # Security Hardening: drop all kernel capabilities & prevent privilege escalation
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Read-only root container filesystem (only SQLite volume and /tmp are writable)
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/lores.db}
      - JWT_SECRET=${JWT_SECRET:-lores-production-secret-key-change-in-prod-32bytes}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://localhost:5173,http://localhost:${APP_PORT:-8156}}
      - APP_URL=${APP_URL:-http://localhost:${APP_PORT:-8156}}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-noreply@lores.family}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME:-Lores Family Tree}
      - SMTP_TLS=${SMTP_TLS:-true}
    volumes:
      - lores_data:/app/data:rw

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lores-frontend
    restart: unless-stopped
    # Security Hardening: drop kernel capabilities & prevent privilege escalation
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    # Bind exclusively to 127.0.0.1 for Cloudflare Tunnel / Local reverse proxy
    ports:
      - "127.0.0.1:${APP_PORT:-8156}:80"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  lores_data:
