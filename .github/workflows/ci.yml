name: Lores CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend (FastAPI, Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Linter Check
        run: ruff check .

      - name: Ruff Code Formatting Check
        run: ruff format --check .

      - name: Static Type Check (Mypy)
        run: mypy app

      - name: Run Backend Tests
        run: pytest -v --cov=app

  frontend-ci:
    name: Frontend (React, TypeScript, A11y, Playwright, Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint & Static A11y Check (ESLint + JSX-A11y)
        run: npm run lint

      - name: TypeScript & Production Bundle Build
        run: npm run build

      - name: Run Unit & Component A11y Tests (Vitest + Vitest-Axe)
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E Accessibility Audits (Playwright + Axe-Core)
        run: npm run test:e2e:a11y

      - name: Run Lighthouse Accessibility CI
        run: npx lhci autorun
