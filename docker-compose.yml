services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lores-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/lores.db}
      - JWT_SECRET=${JWT_SECRET:-lores-production-secret-key-change-in-prod-32bytes}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}
    volumes:
      - lores_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lores-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  lores_data:
