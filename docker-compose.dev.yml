services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lores-backend-dev
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/lores.db}
      - JWT_SECRET=${JWT_SECRET:-lores-dev-secret-key-change-in-prod-32bytes}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:3000,http://localhost:${APP_PORT:-8156}}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-noreply@lores.family}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME:-Lores Family Tree}
      - SMTP_TLS=${SMTP_TLS:-true}
    volumes:
      - lores_data:/app/data
      - ./backend/app:/app/app
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/requirements-dev.txt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lores-frontend-dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8156}:5173"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json

volumes:
  lores_data:
