services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lores-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/lores.db
      - JWT_SECRET=lores-production-secret-key-change-in-prod-32bytes
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
    volumes:
      - lores_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lores-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  lores_data:
